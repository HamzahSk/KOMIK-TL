[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "typeset-rs"
version = "0.1.0"
requires-python = ">=3.8"
description = "Pure-Rust clustering, layout/margin and color/stroke extraction for comic-typesetting (PyO3 + rust-numpy)."

[tool.maturin]
module-name = "typeset_rs"
