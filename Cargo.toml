[package]
name = "komik-tl"
version = "0.1.0"
edition = "2021"
description = "Manga auto-translator (Rust port)"

[dependencies]
leptess = "0.14"
reqwest = { version = "0.12", features = ["blocking", "json"] }
scraper = "0.21"
image = "0.25"
imageproc = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
log = "0.4"
env_logger = "0.11"
zip = "2"
rayon = "1"
regex = "1"
url = "2"
rand = "0.8"
anyhow = "1"
thiserror = "2"
chrono = "0.4"
rusttype = "0.9"
