name: OpenCode Rust Migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opencode:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # Setup Node.js dibutuhkan untuk menjalankan opencode-ai
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Setup Rust environment
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Install dependensi sistem untuk Tesseract OCR agar tidak error saat cargo check
      - name: Install OCR System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr libtesseract-dev libleptonica-dev

      - name: Install OpenCode
        run: npm install -g opencode-ai

      - name: Check OpenCode Version
        run: opencode --version

      - name: Run OpenCode with Rust Migration Prompt
        run: |
          opencode run \
            --model opencode/deepseek-v4-flash-free \
            --auto \
            "Tolong ubah seluruh proyek manga auto translator ini (dari Python) menjadi menggunakan bahasa Rust agar prosesnya jauh lebih cepat. Pastikan menggunakan crate leptess versi 0.14 di Cargo.toml. Tolong tingkatkan juga sistem logging-nya agar lebih detail dan perbaiki logika akurasi OCR-nya." || true

      - name: Collect changed files
        run: |
          # Tambahkan semua perubahan, tapi abaikan folder target/ atau cache agar ukuran kecil
          git add -A

          mkdir -p output_artifact

          # Hanya copy file source code yang diubah/dibuat, abaikan folder 'target', node_modules, atau .git
          for file in $(git diff --cached --name-only); do
            # Filter: lewati file jika berada di dalam folder target/ atau direktori sementara lainnya
            if [[ "$file" == target/* ]] || [[ "$file" == .cargo/* ]] || [[ "$file" == *.lock ]]; then
              continue
            fi

            if [ -f "$file" ]; then
              mkdir -p "output_artifact/$(dirname "$file")"
              cp "$file" "output_artifact/$file"
            fi
          done

      - name: Upload Rust Code Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-rust-result-${{ github.sha }}
          path: output_artifact/
          retention-days: 7
